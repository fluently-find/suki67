<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7b3a">
<title>Crash Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b1a10;--card:#fff6e6;--text:#3b1a10;--mute:#9a6b4f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
html,body{height:100%;margin:0;background:#ff7436;color:var(--text);overflow:hidden;font-family:'Rubik',system-ui,sans-serif;font-weight:700}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(#ec5a30,#f98a46 55%,#fdac50)}
#top{display:flex;align-items:center;gap:8px;padding:9px 10px 7px}
.logo{flex:1;font-family:'Lilita One',Impact,'Arial Black',sans-serif;font-weight:400;font-size:25px;line-height:.95;color:#ffd23f;letter-spacing:.6px;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink),0 6px 8px rgba(120,30,0,.35)}
.logo small{display:inline-block;font-family:'Rubik',sans-serif;font-size:9px;letter-spacing:1px;color:#fff3da;text-shadow:none;margin-top:5px;font-weight:700;background:var(--ink);border-radius:6px;padding:2px 7px}
.bal{display:flex;align-items:center;gap:7px;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:3px 11px 3px 6px;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #fff}
.coin{width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4a8,#ffc21a 55%,#e08a00);border:2.5px solid var(--ink);position:relative;flex:none}
.coin::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.bal span{display:block;font-size:9px;color:var(--mute);letter-spacing:.8px;line-height:1}
.bal b{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:19px;line-height:1.05}
.btn{position:relative;border:3px solid var(--ink);border-radius:14px;font-family:'Lilita One',Impact,'Arial Black',sans-serif;font-weight:400;color:#fff;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(59,26,16,.45);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease}
.btn::before{content:"";position:absolute;left:7%;right:7%;top:3px;height:34%;border-radius:10px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn:disabled{filter:grayscale(.75) brightness(1.05);opacity:.65;cursor:not-allowed}
#depo{background:linear-gradient(#8cf29a,#2fc24a);font-size:16px;padding:0 13px;height:42px;letter-spacing:.5px}
#stage{flex:1;min-height:0;position:relative;margin:0 6px;border-radius:20px;overflow:hidden;border:4px solid var(--ink);
  box-shadow:0 5px 0 var(--ink),0 0 0 3px #ffe7b8,0 12px 26px rgba(40,20,60,.38)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;box-shadow:inset 0 0 38px rgba(60,14,20,.3),inset 0 2px 0 rgba(255,255,255,.35)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#hud{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:8px;z-index:2}
.pill{border:3px solid var(--ink);border-radius:16px;padding:3px 10px 5px;min-width:92px;max-width:46%;text-align:center;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.4);color:#fff;text-shadow:0 2px 0 rgba(59,26,16,.5)}
.pill span{display:block;font-size:10px;letter-spacing:.6px;line-height:1.2}
.pill b{display:block;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:26px;line-height:1.05;white-space:nowrap}
#muBox{background:linear-gradient(#ffd966,#ff8f1a)}
#muBox.hot{background:linear-gradient(#ff9bb8,#ff3d6e);animation:hot .6s ease-in-out infinite alternate}
#muBox.pop b{animation:pop .35s ease}
.py{background:linear-gradient(#8cf29a,#2fc24a)}
.py b{font-size:20px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes hot{to{transform:scale(1.05)}}
#hint{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:max-content;max-width:82%;text-align:center;background:rgba(59,26,16,.8);color:#fff3da;
  font-size:12px;line-height:1.35;padding:8px 15px;border-radius:99px;border:2px solid rgba(255,214,150,.65);pointer-events:none;z-index:2;animation:hintp 2s ease-in-out infinite}
@keyframes hintp{50%{opacity:.72}}
#panel{padding:10px 10px 9px;display:flex;flex-direction:column;gap:8px}
#ctl{display:grid;grid-template-columns:44px 40px 1fr 40px 44px;gap:6px;align-items:stretch}
.sm{background:linear-gradient(#7ad7ff,#2f93ec);font-size:15px;min-height:42px;padding:0}
.sm.t{font-family:'Rubik',sans-serif;font-weight:700;font-size:11px;letter-spacing:.3px;min-height:34px;padding:0 10px}
.sm.on{background:linear-gradient(#ffd966,#ff9f1a)}
#betBox{background:var(--card);border:3px solid var(--ink);border-radius:14px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #fff}
#betBox span{font-size:9px;color:var(--mute);letter-spacing:1px;line-height:1.1}
#betBox b{font-family:'Lilita One',Impact,sans-serif;font-size:21px;font-weight:400;line-height:1.05}
#acts{display:flex;gap:8px}
.big{flex:1;min-height:60px;font-size:25px;letter-spacing:.5px;border-radius:18px}
.big small{display:block;font-family:'Rubik',sans-serif;font-size:11px;font-weight:700;text-shadow:none;opacity:.95;margin-top:1px}
#start{background:linear-gradient(#8cf29a,#2fc24a 55%,#1ea23a)}
#drop{background:linear-gradient(#ffb347,#ff6a1a 55%,#e24a0a);flex:1.5;font-size:30px}
#drop:not(:disabled){animation:bounce .9s ease-in-out infinite}
#cash{background:linear-gradient(#fff08a,#ffc21a 55%,#f0a000);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.6)}
@keyframes bounce{50%{transform:translateY(-3px)}}
.hide{display:none!important}
#foot{display:flex;gap:6px;align-items:center}
#hist{flex:1;display:flex;gap:5px;overflow:hidden;height:24px;align-items:center}
#hist i{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;flex:none;border:2px solid var(--ink);color:var(--ink)}
#hist .w{background:#8cf29a}#hist .m{background:#ffe27a}#hist .l{background:#ff9aa8}
#modal{position:absolute;inset:0;background:rgba(60,20,50,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.card{width:100%;max-width:380px;background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 7px 0 var(--ink),inset 0 3px 0 #fff}
.card h2{margin:0 0 2px;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:26px;color:#ff7a1a;text-shadow:0 2px 0 var(--ink)}
.card p{margin:0 0 10px;font-size:12px;color:var(--mute);line-height:1.35}
#amts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
#amts button{background:linear-gradient(#7ad7ff,#2f93ec);font-size:15px;padding:8px 0}
#amts button.sel{background:linear-gradient(#ffd966,#ff9f1a)}
#custom{width:100%;border:3px solid var(--ink);border-radius:14px;font-family:'Lilita One',Impact,sans-serif;font-size:22px;padding:8px 12px;margin-bottom:6px;background:#fff;color:var(--ink);outline:none}
#custom:focus{border-color:#ff7a1a}
#err{min-height:16px;font-size:12px;color:#d62a4a;margin-bottom:6px}
#go{width:100%;background:linear-gradient(#8cf29a,#2fc24a);font-size:22px;padding:10px 0;margin-bottom:8px}
#close{width:100%;background:linear-gradient(#ffb0bc,#ff5d7a);font-size:16px;padding:8px 0}
.tot{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){#drop:not(:disabled),#muBox.hot,#hint{animation:none}}
@media (max-height:640px){.big{min-height:50px}}

/* ===== UPGRADE: dunia mainan bata ===== */
html,body{background:linear-gradient(#d9431f,#f98a46 55%,#fdb556) fixed}
body::before{content:"";position:fixed;left:50%;top:50%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;background:repeating-conic-gradient(rgba(255,244,200,.12) 0 7deg,transparent 7deg 14deg);animation:spin 90s linear infinite;pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,transparent 40%,rgba(90,20,0,.38));pointer-events:none;z-index:0}
#app{background:none;z-index:1;overflow:hidden}
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.brk{position:absolute;bottom:-80px;width:var(--w);height:calc(var(--w)*.55);font-style:normal;background:linear-gradient(var(--c1),var(--c2));border:2px solid var(--ink);border-radius:4px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.2);opacity:.8;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
.brk::before{content:"";position:absolute;left:10%;right:10%;top:-7px;height:7px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,var(--c1) 2px 9px,var(--ink) 9px 11px,transparent 11px 15px);border-radius:3px 3px 0 0}
.gear{position:absolute;width:var(--s);height:var(--s);opacity:.2;animation:spin var(--t) linear infinite var(--dir)}
.gear::before{content:"";position:absolute;inset:12%;border-radius:50%;border:calc(var(--s)*.1) solid var(--ink)}
.gear::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(var(--ink) 0 11deg,transparent 11deg 22deg);-webkit-mask:radial-gradient(circle closest-side,transparent 78%,#000 79%);mask:radial-gradient(circle closest-side,transparent 78%,#000 79%)}
.spk{position:absolute;width:5px;height:5px;background:#ffd37a;border-radius:1px;box-shadow:0 0 8px 3px rgba(255,150,40,.75);animation:twk var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(-125vh) rotate(var(--r1))}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3) rotate(45deg)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
/* header + pita hazard */
#top{position:relative;z-index:2;padding-bottom:12px}
#top::after{content:"";position:absolute;left:-30px;right:-30px;bottom:2px;height:8px;border-block:2px solid var(--ink);background:repeating-linear-gradient(135deg,#ffd23f 0 8px,#3b1a10 8px 16px);animation:tape 1s linear infinite;pointer-events:none}
@keyframes tape{to{transform:translateX(22.63px)}}
/* logo bata */
.logo{text-shadow:none;font-size:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding-top:7px}
.lr{display:flex;gap:2px}
.lt{--c1:#f47a1c;--c2:#cb3409;position:relative;display:block;width:18px;height:20px;border:2px solid var(--ink);border-radius:5px;font-style:normal;background:linear-gradient(var(--c1),var(--c2));color:#fff;font:400 14px/16px 'Lilita One',Impact,sans-serif;text-align:center;text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.4);animation:drop .8s cubic-bezier(.3,1.6,.5,1) calc(var(--i)*.07s) backwards,wave 2.6s ease-in-out calc(1.4s + var(--i)*.12s) infinite}
.lt::before{content:"";position:absolute;top:-7px;left:3px;width:8px;height:5px;border:2px solid var(--ink);border-bottom:0;border-radius:3px 3px 0 0;background:var(--c1)}
.logo small{margin-top:3px}
@keyframes drop{from{transform:translateY(-80px) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wave{0%,55%,100%{transform:none;filter:none}25%{transform:translateY(-4px) rotate(-5deg);filter:brightness(1.25)}}
.coin{animation:flip 2.4s ease-in-out infinite}
@keyframes flip{50%{transform:scaleX(.2)}}
#depo{animation:wob 3.2s ease-in-out infinite}
@keyframes wob{0%,84%,100%{transform:none}89%{transform:rotate(-5deg)}94%{transform:rotate(5deg)}}
/* panel papan kayu berpaku */
#panel{position:relative;z-index:2;margin:9px 6px 6px;padding:15px 14px 12px;border:4px solid var(--ink);border-radius:18px;
 background:radial-gradient(circle at 8px 8px,#efe6d0 0 2px,var(--ink) 2.4px 3.6px,transparent 4px) no-repeat,
 radial-gradient(circle at calc(100% - 8px) 8px,#efe6d0 0 2px,var(--ink) 2.4px 3.6px,transparent 4px) no-repeat,
 radial-gradient(circle at 8px calc(100% - 8px),#efe6d0 0 2px,var(--ink) 2.4px 3.6px,transparent 4px) no-repeat,
 radial-gradient(circle at calc(100% - 8px) calc(100% - 8px),#efe6d0 0 2px,var(--ink) 2.4px 3.6px,transparent 4px) no-repeat,
 linear-gradient(rgba(255,255,255,.14),transparent 40%),repeating-linear-gradient(90deg,#8d4722 0 30px,#7a3a19 30px 32px);
 box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,214,150,.45),inset 0 -12px 20px rgba(30,8,0,.35)}
/* lampu bohlam bingkai stage */
#stage::before{content:"";position:absolute;inset:2px;border:3px dotted #ffe27a;border-radius:15px;z-index:3;pointer-events:none;animation:bulb 1s steps(1) infinite}
@keyframes bulb{0%{opacity:1}50%{opacity:.35}}
/* tombol bata: studs di atas */
.btn{--sc:#6fe08a}
.btn::after{content:"";position:absolute;left:10px;right:10px;top:-7px;height:7px;pointer-events:none;
 background:repeating-linear-gradient(90deg,transparent 0 3px,var(--ink) 3px 17px,transparent 17px 24px) top/100% 2px no-repeat,repeating-linear-gradient(90deg,transparent 0 3px,var(--ink) 3px 5px,var(--sc) 5px 15px,var(--ink) 15px 17px,transparent 17px 24px)}
#amts .btn::after{display:none}
#drop{--sc:#ff8a2a}#cash{--sc:#ffd23f}.sm{--sc:#4aa6f0}.sm.on{--sc:#ffc233}#close{--sc:#ff7a92}
#start{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,255,200,.85)}100%{box-shadow:0 4px 0 var(--ink),0 0 0 12px rgba(255,255,200,0)}}
@media (prefers-reduced-motion:reduce){.brk,.spk,.gear,.lt,#top::after,#stage::before,#start,#depo,.coin,body::before{animation:none!important}}

/* ===== UPGRADE 2: loading screen, awan, tombol berkilau ===== */
.bgx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cld{position:absolute;left:0;width:110px;height:44px;font-style:normal;opacity:.5;background:radial-gradient(circle at 25% 68%,#fff 0 14px,transparent 15px),radial-gradient(circle at 50% 42%,#fff 0 20px,transparent 21px),radial-gradient(circle at 76% 68%,#fff 0 15px,transparent 16px),linear-gradient(#fff,#fff) 50% 100%/78% 15px no-repeat;animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drift{from{transform:translateX(-160px) scale(var(--k))}to{transform:translateX(110vw) scale(var(--k))}}
body:not(.open) #app .lt{animation-play-state:paused}
.btn:not(:disabled)::before{background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%) 150% 0/250% 100% no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));animation:shine 3.4s ease-in-out infinite}
#ctl .btn:nth-child(odd)::before,#foot .btn:nth-child(odd)::before{animation-delay:1.3s}
@keyframes shine{0%,55%{background-position:150% 0,0 0}100%{background-position:-60% 0,0 0}}
.btn:hover:not(:disabled):not(:active){filter:brightness(1.1)}
#top .logo{position:relative}
#top .logo::before{content:"";position:absolute;left:146px;top:0;width:14px;height:24px;transform-origin:50% 0;background:linear-gradient(var(--ink),var(--ink)) 50% 0/2px 16px no-repeat,linear-gradient(#ffd23f,#e0a000) 50% calc(100% - 2px)/8px 6px no-repeat,linear-gradient(var(--ink),var(--ink)) 50% 100%/12px 10px no-repeat;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
/* loading screen */
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;overflow:hidden;background:linear-gradient(#d9431f,#f98a46 55%,#fdb556);transition:transform .75s cubic-bezier(.7,0,.3,1)}
#boot.out{transform:translateY(-105%)}
#boot::before{content:"";position:absolute;left:50%;top:50%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;background:repeating-conic-gradient(rgba(255,244,200,.14) 0 7deg,transparent 7deg 14deg);animation:spin 70s linear infinite}
#boot::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent 38%,rgba(90,20,0,.45));pointer-events:none}
#boot>*{position:relative;z-index:2}#boot>.bgx{position:absolute;z-index:1}#boot>.tp{position:absolute;left:-30px;right:-30px;height:14px;border-block:3px solid var(--ink);background:repeating-linear-gradient(135deg,#ffd23f 0 12px,#3b1a10 12px 24px);animation:tape2 1s linear infinite;z-index:3}
#boot>.tp.a{top:calc(env(safe-area-inset-top,0px) + 6px)}#boot>.tp.b{bottom:6px;animation-direction:reverse}
@keyframes tape2{to{transform:translateX(33.94px)}}
#boot .logo{align-items:center;gap:15px;padding:0;font-size:0;flex:none;animation:bob 3s ease-in-out infinite}
#boot .lr{gap:3px}
#boot .lt{width:34px;height:40px;font-size:27px;line-height:33px;border-width:3px;border-radius:8px;box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4);text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink)}
#boot .lt::before{top:-11px;left:6px;width:16px;height:8px;border-width:3px;border-radius:5px 5px 0 0}
@keyframes bob{50%{transform:translateY(-6px)}}
.sub{font:700 11px 'Rubik',sans-serif;letter-spacing:1px;color:#fff3da;background:var(--ink);border-radius:8px;padding:3px 10px}
.tw{position:relative;width:170px;height:150px;border-bottom:6px solid var(--ink)}
.tw::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,#8d4722 0 14px,#6d3115 14px 16px)}
.tb{position:absolute;left:50%;bottom:calc(var(--k)*28px);width:var(--w);height:28px;margin-left:calc(var(--w)/-2 + var(--x));background:linear-gradient(var(--c1),var(--c2));border:3px solid var(--ink);border-radius:5px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.2);animation:bdrop 5s ease-in infinite;animation-delay:calc(var(--k)*.55s)}
.tb::before{content:"";position:absolute;left:10%;right:10%;top:-9px;height:9px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,var(--c1) 3px 12px,var(--ink) 12px 15px,transparent 15px 20px);border-radius:3px 3px 0 0}
@keyframes bdrop{0%{transform:translateY(-340px);opacity:0}6%{opacity:1}15%{transform:none;animation-timing-function:ease-out}18%{transform:translateY(-12px)}21%,90%{transform:none;opacity:1}100%{transform:none;opacity:0}}
.ar{position:relative;width:min(86vw,320px);height:70px}
.ar>*{position:absolute;inset:0}
.pb{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;transition:opacity .3s}
.pb b{font:400 17px 'Lilita One',Impact,sans-serif;color:#fff;text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink),0 3px 0 var(--ink);text-align:center}
.pbar{display:flex;gap:4px;padding:5px;border:4px solid var(--ink);border-radius:12px;background:#4a2410;box-shadow:0 4px 0 var(--ink),inset 0 3px 8px rgba(0,0,0,.5)}
.pbar i{flex:1;height:22px;border-radius:4px;background:#6a3519}
.pbar i.on{background:linear-gradient(var(--c1),var(--c2));border:2px solid var(--ink);animation:cpop .35s ease}
@keyframes cpop{40%{transform:scale(1.25)}}
#tip{font:700 12px 'Rubik',sans-serif;color:#fff3da;text-align:center;min-height:30px;max-width:290px;line-height:1.35;animation:tipf 2.2s ease-in-out infinite}
@keyframes tipf{0%,100%{opacity:0}15%,85%{opacity:1}}
#enter{opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);font-size:30px}

#top .logo .lr:nth-child(1){--lw:min(7.2vw,31px)}
#top .logo .lr:nth-child(2){--lw:min(9.2vw,40px)}
#panel{margin:4px 6px 4px;padding:8px 9px 6px;gap:5px}
.sm{min-height:32px}
.sm.t{min-height:26px}
.big{min-height:42px;font-size:19px}
#drop{font-size:22px}
#hist{height:18px}
@media (max-height:700px){#top .logo .lr:nth-child(1){--lw:min(6.6vw,28px)}#top .logo .lr:nth-child(2){--lw:min(8.4vw,36px)}#top .logo{padding-top:6px;gap:3px}}
@media (max-height:640px){.big{min-height:40px}}

/* ===== layar game lebih tinggi dan besar ===== */
#app{max-width:560px}
#top{padding-top:4px!important;padding-bottom:10px!important;gap:2px!important}
#stage{margin:0 3px!important;border-width:3px!important;border-radius:16px!important}
#panel{margin:6px 4px 4px!important;padding:10px 10px 8px!important;gap:6px!important}
.big{min-height:50px!important;font-size:22px!important}
#ctl .sm{min-height:36px!important}

/* ===== logo lurus dan pas di tengah ===== */
@keyframes wave{0%,60%,100%{transform:none}30%{transform:translateY(-3px)}}
@keyframes slam{0%{transform:translateY(-130vh) scale(1.3);opacity:0}45%{opacity:1}68%{transform:translateY(0) scale(1.18,.78)}82%{transform:translateY(-6px) scale(.94,1.1)}100%{transform:none;opacity:1}}
#top .logo,#boot .logo{transform:none;align-self:center;margin-left:auto;margin-right:auto;width:100%;justify-content:center;align-items:center}
#top .logo .lr,#boot .logo .lr{justify-content:center;align-self:center}
#top .logo{--lw:min(6.6vw,28px);padding:6px 0 3px}
#top .logo .lr:nth-child(1){--lw:min(6.6vw,28px)}
#top .logo .lr:nth-child(2){--lw:min(8.4vw,36px)}

/* ===== plang loading: berdiri, besar, mengapit logo ===== */
#boot .logo{position:relative}
#boot .logo>.sgw{position:absolute;z-index:3;width:clamp(46px,14.5vw,58px);height:clamp(46px,14.5vw,58px);bottom:-2px;display:block;
  filter:drop-shadow(0 6px 0 rgba(59,26,16,.5)) drop-shadow(0 0 20px rgba(255,214,90,.6));animation:sgp 2.8s ease-in-out infinite,sgin .7s ease 2.2s backwards}
#boot .logo>.sgw.l{left:-10px;--r:-8deg;transform:rotate(-8deg)}
#boot .logo>.sgw.r{right:-10px;--r:8deg;transform:rotate(8deg);animation-delay:-1.4s,2.2s}
#boot .sgw>.sg{position:relative;left:0;top:0;width:100%;height:100%}
#boot .sgw>.sg.ne{border-width:4px;box-shadow:0 0 0 3px var(--ink)}
@keyframes sgp{0%,100%{transform:rotate(var(--r)) scale(1)}50%{transform:rotate(var(--r)) scale(1.07)}}
@keyframes sgin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot .logo>.sgw{animation:none!important}}

<body>
<div id="app">
  <div id="top">
    <div class="logo"><div class="lr" data-t="BUILDER"></div><div class="lr" data-t="CRASH"></div></div>
    <div class="row2">
      <div class="bal"><i class="coin"></i><div><span>SALDO</span><b id="bal">0</b></div></div>
      <small class="demo">DEMO | KOIN VIRTUAL</small>
      <button class="btn" id="depo">+ DEPO</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint" class="hide"></div>
    <div id="hud">
      <div class="pill" id="muBox"><span id="fl">LANTAI 0</span><b id="mu">x0.00</b></div>
      <div class="pill py"><span>HADIAH</span><b id="py">0</b></div>
    </div>
  </div>
  <div id="panel">
    <div id="ctl">
      <button class="btn sm" id="min">MIN</button>
      <button class="btn sm" id="minus">-</button>
      <div id="betBox"><span>TARUHAN</span><b id="bet">1</b></div>
      <button class="btn sm" id="plus">+</button>
      <button class="btn sm" id="max">MAX</button>
    </div>
    <div id="acts">
      <button class="btn big" id="start">MULAI</button>
      <button class="btn big hide" id="drop" disabled>JATUHKAN</button>
      <button class="btn big hide" id="cash" disabled>CASH OUT</button>
    </div>
    <div id="foot">
      <div id="hist"></div>
      <button class="btn sm t" id="auto">AUTO MATI</button>
      <button class="btn sm t on" id="snd">SUARA</button>
    </div>
  </div>

  <div id="modal" class="hide">
    <div class="card">
      <h2>ISI SALDO (DEPO)</h2>
      <p>Pilih nominal atau ketik sendiri. Ini koin virtual untuk game demo, tidak ada uang asli. Deposit dan tarik koin juga bisa lewat lobi (simulasi).</p>
      <div id="amts"></div>
      <input id="custom" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Nominal lain">
      <div id="err"></div>
      <button class="btn" id="go">ISI SEKARANG</button>
      <button class="btn" id="close">TUTUP</button>
      <div class="tot" id="tot"></div>
    </div>
  </div>
</div>

<div id="boot">
  <i class="tq ta"></i><i class="tq tb2"></i><i class="tq cs l"></i><i class="tq cs r"></i>
  
  <i class="cone l"></i><i class="cone r"></i>
    <div class="logo"><span class="sgw l"><i class="sg wr"></i></span><span class="sgw r"><i class="sg ne"></i></span><div class="lr" data-t="BUILDER"></div><div class="lr" data-t="CRASH"></div></div>

  <i class="glow"></i>

    <div class="pb"><b id="pct">MEMBANGUN 0%</b><div class="pbar" id="pbar"></div></div>

  </div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),appEl=$('app');
const LW=380,CX=190,FONT="'Lilita One',Impact,'Arial Black',sans-serif",OUT='#3b1a10';
const STREET=0,AMP=108,CABLE=44,Y0=22,BT=58,PLAT=240;
let LH=700,sc=1,dpr=1,cam0=0,camY=0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry((Date.now()^0x5bd1e995)&0xffffff);
const rnd=(a,b)=>a+R()*(b-a),pick=a=>a[(R()*a.length)|0];
const r2=v=>Math.round(v*100)/100;
const fmt=v=>{v=r2(v);return v.toLocaleString('id-ID',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2});};

/* ============ SUARA (digenerate) ============ */
let ac=null,mute=false;
function au(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();const c=ac.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;c.connect(ac.destination);bus=ac.createGain();bus.gain.value=.9;bus.connect(c);const d=ac.createDelay(.5);d.delayTime.value=.17;const fb=ac.createGain();fb.gain.value=.3;const wet=ac.createGain();wet.gain.value=.22;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(c);}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();if(ac&&!musOn)startMus();}
let bus=null;
const SC=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5,1568,1760];
function tone(f,d,type,v,sl,delay){if(!ac||mute||!bus)return;const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v||.1,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(bus);o.start(t0);o.stop(t0+d+.05);}
function noise(d,v,fq,delay,sw){if(!ac||mute||!bus)return;const t0=ac.currentTime+(delay||0),n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(fq||800,t0);if(sw)f.frequency.exponentialRampToValueAtTime(Math.max(80,sw),t0+d);const g=ac.createGain();g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(bus);s.start(t0);}
function bell(f,d,v,dl){tone(f,d,'sine',v,0,dl);tone(f*2.005,d*.7,'sine',v*.35,0,dl);tone(f*3.01,d*.4,'triangle',v*.12,0,dl);}
function pluck(f,d,v,dl){tone(f,d,'triangle',v,0,dl);tone(f*2,d*.5,'sine',v*.45,0,dl);}
function sparkle(c,dl,v){for(let i=0;i<c;i++){const f=SC[8+((Math.random()*7)|0)]*(Math.random()<.5?1:2);tone(f,.16,'sine',v||.035,0,(dl||0)+i*.045+Math.random()*.02);}}
function coinPing(dl,v){tone(1568,.07,'square',v*.45,0,dl);tone(2349,.22,'sine',v,0,dl+.04);}
const PEN=[0,2,4,7,9];
const sfx={
  click(){tone(620,.06,'sine',.08,320);tone(1240,.05,'triangle',.035,0,.012)},
  start(){[0,4,7,9,12].forEach((k,i)=>pluck(SC[Math.min(k+2,14)],.28,.07,i*.065));bell(SC[9],.55,.07,.34);noise(.35,.04,600,0,3500);sparkle(4,.25,.03)},
  clunk(){noise(.2,.1,2800,0,600);tone(220,.1,'square',.045,-120);tone(80,.16,'sine',.12,-30,.02);noise(.3,.035,7000,.05,2500)},
  drop(){tone(1100,.34,'triangle',.07,-800);noise(.24,.06,3400,0,300)},
  land(){const k=PEN[n%5]+Math.floor(n/5)*2+1;tone(140,.2,'sine',.24,-80);noise(.18,.14,650,0,160);tone(260,.16,'sine',.09,180,.02);pluck(SC[Math.min(k+2,14)],.35,.09,.03);pluck(SC[Math.min(k+4,14)],.3,.06,.1);},
  perfect(){const b=Math.min(perf,5);[0,2,4,7,9,11].forEach((k,i)=>bell(SC[Math.min(k+3+b,14)],.5,.085,i*.05));[0,4,7].forEach(k=>pluck(SC[Math.min(k+6+b,14)],.7,.06,.34));tone(90,.3,'sine',.2,-40);sparkle(10,.1,.04);noise(.5,.05,7000,.08,2000)},
  good(){pluck(SC[Math.min(n+2,14)],.3,.07,.06);pluck(SC[Math.min(n+4,14)],.3,.07,.13);sparkle(2,.16,.03)},
  warn(){[0,.2,.4].forEach(d=>{tone(392,.14,'triangle',.07,0,d);tone(311,.14,'triangle',.07,0,d+.1)})},
  crash(){noise(1.4,.4,900,0,90);tone(110,.9,'sawtooth',.12,-70);tone(60,.8,'sine',.25,-20);[.12,.28,.45,.62,.8].forEach(d=>noise(.18,.14,1200,d,200));[392,349,330,262].forEach((f,i)=>tone(f,.3,'triangle',.05,-10,1+i*.24))},
  cash(){for(let i=0;i<14;i++)coinPing(i*.05+Math.random()*.01,.07);[0,2,4,7,9,11,12].forEach((k,i)=>bell(SC[Math.min(k+2,14)],.45,.075,i*.07));[0,4,7].forEach(k=>pluck(SC[Math.min(k+7,14)],.9,.07,.55));sparkle(14,.3,.04);noise(.7,.05,6500,.1,1800)}
};

/* ============ MUSIK LATAR (digenerate) ============ */
let musOn=false,musNext=0,musStep=0,musTimer=0;
const mf=sm=>261.63*Math.pow(2,sm/12),CHORDS=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],ROOTS=[0,-5,-3,-7],ARP=[0,1,2,1,0,1,2,1];
function musTick(){
  if(!ac||document.hidden){musNext=ac?ac.currentTime+.1:0;return;}
  const ei=60/108/2;
  while(musNext<ac.currentTime+.35){
    const dl=Math.max(0,musNext-ac.currentTime),bar=(musStep>>3)&3,e=musStep&7,ch=CHORDS[bar];
    if(e===0||e===4){tone(mf(ROOTS[bar]-12),ei*3.2,'sine',.05,0,dl);}
    tone(mf(ch[ARP[e]]+12),ei*1.6,'triangle',.024,0,dl);
    if(e%2===1)noise(.04,.012,7000,dl,3000);
    if(n>=4&&e%4===0)tone(120,.12,'sine',.05,-80,dl);
    if(n>=8&&e%2===0)tone(mf(ch[(e>>1)%3]+24),ei*1.2,'sine',.016,0,dl);
    if((e===2||e===5||e===7)&&R()<.55)tone(mf(PEN[(R()*5)|0]+24),ei*2.2,'sine',.03,0,dl);
    musNext+=ei;musStep++;
  }
}
function startMus(){if(musOn||!ac)return;musOn=true;musNext=ac.currentTime+.15;musTimer=setInterval(musTick,90);}

/* ============ UTIL ============ */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lg(g,x0,y0,x1,y1,st){const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>q.addColorStop(s[0],s[1]));return q;}
function hexRGB(h){if(h.length===4)return [parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16),parseInt(h[3]+h[3],16)];return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixHex(h,N,f){const c=hexRGB(h);return `rgb(${(c[0]+(N[0]-c[0])*f)|0},${(c[1]+(N[1]-c[1])*f)|0},${(c[2]+(N[2]-c[2])*f)|0})`;}
const NIGHT=[24,20,72];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixV=(a,b,t)=>typeof a==='number'?a+(b-a)*t:a.map((v,i)=>mixV(v,b[i],t));
function mixPal(a,b,t){const o={};for(const k in a)o[k]=mixV(a[k],b[k],t);return o;}

/* ============ SIKLUS WAKTU: sore, malam, pagi, siang ============ */
const PN=['SORE','MALAM','PAGI','SIANG'];
const PH=[
 {skyT:[236,90,48],skyB:[253,172,80],glow:[255,226,140],glowA:.55,sunC:[255,226,150],sun:[.74,.6],sunA:1,moon:[.2,1.05],moonA:0,stars:0,dk:0,
  b:[[238,112,60],[245,130,62],[251,150,66],[253,172,80]],
  wd:[[246,136,76],[252,156,80],[255,180,98],[255,196,110]],
  wl:[[255,206,120],[255,212,126],[255,220,136],[255,228,150]],
  crane:[249,160,72],craneLt:[255,198,120],cloudHi:[255,206,150],cloudLo:[236,110,80],
  wk0:[230,217,203],wk1:[191,174,159],rd0:[109,72,82],rd1:[61,38,48],cc0:[196,190,196],cc1:[150,142,152]},
 {skyT:[8,12,40],skyB:[66,46,118],glow:[160,120,230],glowA:.22,sunC:[255,226,150],sun:[.5,1.2],sunA:0,moon:[.3,.2],moonA:1,stars:1,dk:1,
  b:[[44,44,102],[52,50,116],[62,56,128],[74,64,142]],
  wd:[[52,52,116],[62,60,130],[74,68,146],[88,76,160]],
  wl:[[255,208,110],[255,214,120],[255,222,130],[255,230,150]],
  crane:[92,74,150],craneLt:[124,104,184],cloudHi:[96,84,160],cloudLo:[52,46,104],
  wk0:[118,112,148],wk1:[80,74,110],rd0:[44,34,64],rd1:[24,18,40],cc0:[96,96,128],cc1:[66,66,98]},
 {skyT:[132,160,232],skyB:[255,204,166],glow:[255,240,190],glowA:.6,sunC:[255,240,190],sun:[.22,.66],sunA:1,moon:[.8,.42],moonA:.3,stars:.12,dk:.2,
  b:[[198,160,200],[218,168,184],[236,176,168],[248,190,160]],
  wd:[[210,172,208],[230,182,194],[246,192,178],[255,206,176]],
  wl:[[255,236,170],[255,238,176],[255,240,184],[255,244,196]],
  crane:[240,172,112],craneLt:[255,208,152],cloudHi:[255,228,216],cloudLo:[236,170,186],
  wk0:[236,228,220],wk1:[200,190,186],rd0:[120,92,104],rd1:[74,54,66],cc0:[206,204,212],cc1:[170,168,180]},
 {skyT:[70,164,248],skyB:[186,230,255],glow:[255,255,230],glowA:.35,sunC:[255,250,215],sun:[.5,.14],sunA:1,moon:[.9,1.05],moonA:0,stars:0,dk:0,
  b:[[126,174,222],[142,188,226],[160,198,226],[182,212,226]],
  wd:[[150,196,238],[168,208,240],[188,220,244],[210,232,246]],
  wl:[[170,214,250],[184,222,250],[200,230,250],[222,240,250]],
  crane:[244,166,58],craneLt:[255,204,110],cloudHi:[255,255,255],cloudLo:[190,214,240],
  wk0:[222,218,212],wk1:[184,180,176],rd0:[96,92,104],rd1:[58,54,66],cc0:[196,198,204],cc1:[156,158,166]}
];
const TODS=1/36;
let tod=0,pal=PH[0],dk=0,phIdx=0,uiBgT=0;
function calcPal(){
  const i=Math.floor(tod)%4,fr=tod-Math.floor(tod);let b=clamp((fr-.62)/.38,0,1);b=b*b*(3-2*b);
  pal=mixPal(PH[i],PH[(i+1)%4],b);phIdx=b>.5?(i+1)%4:i;
  const hc=clamp((cam0-camY)/900,0,1);
  if(hc>0){pal.skyT=mixV(pal.skyT,[28,22,80],hc*.35);pal.stars=clamp(pal.stars+hc*.35,0,1);}
  dk=pal.dk;
}
const ncCache=new Map();
function nc(h){const k=Math.round(dk*20),key=h+k;let v=ncCache.get(key);if(v)return v;v=mixHex(h,NIGHT,k/20*.5);ncCache.set(key,v);return v;}
function lgn(g,x0,y0,x1,y1,st){return lg(g,x0,y0,x1,y1,st.map(s=>[s[0],nc(s[1])]));}

/* ============ GEDUNG: sama seperti gambar referensi ============ */
const COLS=[
  {b:'#cb3409',l:'#e8420b',m:'#b02a06',d:'#8f2003'},
  {b:'#d8570f',l:'#f47a1c',m:'#bd4609',d:'#9a3704'},
  {b:'#e3a417',l:'#f8c93a',m:'#c68a0f',d:'#a06c05'},
  {b:'#3f9e47',l:'#5cc65e',m:'#318438',d:'#236a29'},
  {b:'#1f9a98',l:'#34c3bc',m:'#187e7d',d:'#0f6261'},
  {b:'#3e6fd2',l:'#5b90f0',m:'#2f58b0',d:'#224490'},
  {b:'#8a4ec4',l:'#a86ae4',m:'#703aa6',d:'#582c86'},
  {b:'#d9568a',l:'#f274a4',m:'#b8426f',d:'#98335a'}
];
let lastCol=-1;
function drawWindow(g,x,y,w,h,kind,lit,night,C){
  if(night&&lit){g.fillStyle='rgba(255,196,90,.17)';rr(g,x-6,y-6,w+12,h+14,6);g.fill();}
  g.fillStyle='rgba(40,8,0,.28)';rr(g,x-2.6,y-1,w+5.2,h+5.4,4);g.fill();
  g.fillStyle=C('#f1ecd9');rr(g,x-2.4,y-2.4,w+4.8,h+4.8,3.4);g.fill();
  const gr=g.createLinearGradient(0,y,0,y+h);
  if(night&&lit){gr.addColorStop(0,'#ffeaa4');gr.addColorStop(1,'#ffb13c');}
  else if(night){gr.addColorStop(0,'#16346e');gr.addColorStop(1,'#1f58a6');}
  else{gr.addColorStop(0,'#2d7cc0');gr.addColorStop(1,'#2dbef3');}
  g.fillStyle=gr;rr(g,x,y,w,h,1.8);g.fill();
  g.save();rr(g,x,y,w,h,1.8);g.clip();
  g.fillStyle=night?'rgba(255,255,255,.1)':'rgba(255,255,255,.24)';
  g.beginPath();g.moveTo(x+w*.55,y+h*.45);g.lineTo(x+w*.8,y);g.lineTo(x+w*.93,y);g.lineTo(x+w*.68,y+h*.45);g.fill();

/* Capit: langkah waktu tetap 1/120 detik, kecepatan dan getaran dihaluskan,
   ayunan dibuat tipis supaya gerakannya mulus dan tidak mengganggu */
const HS=1/120;
let tempo=1,tempoT=1,tempoCd=2.5;
function stepClaw(h){
  tempoCd-=h;
  if(tempoCd<=0){tempoCd=rnd(1.8,4.4);const k=1+.02*Math.min(n,10);
    if(tempoT>1.06)tempoT=rnd(.72,.9);else if(tempoT<.94)tempoT=rnd(1.2,1.38)*k;else tempoT=R()<.5?rnd(.74,.88):rnd(1.18,1.36)*k;}
  tempo+=(tempoT-tempo)*Math.min(1,h*1.5);
  const spT=Math.min(1.9,1.05+.05*n),wbT=Math.min(.16,.04+.012*n);
  spS+=(spT-spS)*Math.min(1,h*1.5);wbS+=(wbT-wbS)*Math.min(1,h*1.5);
  ph4+=h*.5;
  ph1+=h*1.55*spS*tempo*(1+wbS*Math.sin(ph4*1.7));
  ph2+=h*1.05*spS*tempo*(1+wbS*.6*Math.cos(ph4*2.3));
  const u=clamp(.78*Math.sin(ph1)+.22*Math.sin(ph2+1.3),-1,1);
  const nx=CX+AMP*u,nv=(nx-tx)/h,a=(nv-txVel)/h;
  accS+=(a-accS)*Math.min(1,h*6);txVel=nv;tx=nx;
  angV+=(-12.6*Math.sin(ang)-(accS/78)*.18*Math.cos(ang)-angV*2.1)*h;
  ang=clamp(ang+angV*h,-.14,.14);
}
function moveClaw(dt){
  if(!clawInit){clawInit=true;tx=CX+AMP*clamp(.78*Math.sin(ph1)+.22*Math.sin(ph2+1.3),-1,1);txVel=0;accS=0;}
  hAcc+=dt;let k=0;
  while(hAcc>=HS&&k<10){hAcc-=HS;stepClaw(HS);k++;}
  if(k>=10)hAcc=0;
}

function update(dt){

  ryV+=(-190*ry-10*ryV)*dt;ry+=ryV*dt;if(thudCd>0)thudCd-=dt;
  t+=dt;moveClaw(dt);tickWorld(dt);
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*2.5);
  const N=blocks.length;
  let tgt=cam0;
  if(N&&st!=='collapse'&&st!=='end')tgt=Math.min(cam0,blocks[N-1].top-LH*.62);
  if(st==='end'&&endT<1.8)tgt=camY;
  camY+=(tgt-camY)*Math.min(1,dt*(st==='collapse'?2.5:5.5));
  const oT=(st==='load'&&loadT<.12)||st==='release'||st==='fall'||st==='settle'||st==='wobble'||st==='collapse'||st==='end'?1:0;
  openA+=(oT-openA)*Math.min(1,dt*13);
  for(const b of blocks){b.sv+=(-240*b.sq-13*b.sv)*dt;b.sq+=b.sv*dt;}
  const amp=Math.min(1,N/7)*(.6+stress*3.2);
  const tl=leanBias*stress*stress*16+(Math.sin(t*1.5)*.6+Math.sin(t*2.9+1)*.4)*amp*2.6+(st==='wobble'?Math.sin(t*24)*4*(1-wobT/.85*.3):0);
  leanTop+=(tl-leanTop)*Math.min(1,dt*8);
  if((st==='swing'||st==='load'||st==='settle')&&stress>.92&&stress<=1){
    if(fuse<0){fuse=rnd(4,8)/(1+(stress-.92)*3);}
    else{fuse-=dt;if(fuse<=0){fuse=-1;collapse(failK,failDir);}}
  }else if(st!=='release'&&st!=='fall')fuse=-1;
  switch(st){
    case 'idle':
      idleT+=dt;if(!cur)cur=genBlock(0,true);
      if(autoI&&idleT>1.2&&!modalOpen){if(bal_>=BETS[betI])startRound();else autoI=0;}
      break;
    case 'load':loadT+=dt;if(loadT>.3){st='swing';swingT=0;if(pre){pre=false;dropPress();}}break;
    case 'swing':
      swingT+=dt;
      if(autoI&&swingT>.5){
        if(n>=1&&mult>=AUTOS[autoI])cashOut();
        else{const top=N?blocks[N-1].cx:CX,hx=tx+Math.sin(ang)*CABLE;if(Math.abs(hx+txVel*.2-top)<autoThr){autoThr=rnd(5,34);dropPress();}}
      }
      break;
    case 'release':relT-=dt;if(relT<=0)startFall();break;
    case 'fall':{
      fall.vy=Math.min(2600,fall.vy+2600*dt);fall.vx+=wind()*dt;fall.vx*=1-.5*dt;fall.x+=fall.vx*dt;fall.y+=fall.vy*dt;
      fall.rot*=Math.exp(-dt*4);

      break;}
    case 'settle':settleT-=dt;if(settleT<=0)nextBlock();break;
    case 'wobble':wobT-=dt;if(wobT<=0)collapse(failK,failDir);break;
    case 'collapse':
      collT+=dt;stepDebris(dt);

      break;

      if(endT>2.2){blocks=[];debris=[];n=0;perf=0;mult=0;stress=0;sink=0;fuse=-1;leanTop=0;st='idle';idleT=0;cur=genBlock(0,true);openA=0;}
      break;
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;if(p.drag){const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy*=d;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.t+=dt;q.y-=34*dt;if(q.t>q.max)texts.splice(i,1);}

}

skyline(bg,60,90,.22);skyline(bg,44,55,.32);skyline(hdr,14,70,.25);skyline(hdr,10,40,.4);
[bg,hdr].forEach((par,pi)=>{const sc=pi?.75:1;
  for(let i=0;i<(pi?3:6);i++)mk('bird','top:'+(pi?rn(4,36)+'px':rn(8,55)+'%')+';--d:'+rn(16,26)+'s;--dl:-'+rn(0,20)+'s;--k:'+sc,par);});
for(let i=0;i<14;i++)mk('cf','left:'+rn(0,98)+'%;--h:'+(rn(0,360)|0)+';--d:'+rn(9,18)+'s;--dl:-'+rn(0,18)+'s',bg);

<script>
(()=>{
const bg=document.getElementById('bgfx'),rn=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<7;i++){const e=document.createElement('i');e.className='cld';e.style.cssText='top:'+rn(3,70)+'%;--k:'+rn(.6,1.4)+';--d:'+rn(38,80)+'s;--dl:-'+rn(0,60)+'s;opacity:'+rn(.3,.6);bg.appendChild(e);}
const boot=document.getElementById('boot'),cl=bg.cloneNode(true);cl.removeAttribute('id');cl.className='bgx';boot.insertBefore(cl,boot.firstChild);
const PC=[['#f47a1c','#cb3409'],['#f8c93a','#d9930f'],['#5cc65e','#2f8a38'],['#34c3bc','#187e7d'],['#5b90f0','#2f58b0'],['#a86ae4','#703aa6'],['#f274a4','#b8426f']];
const pbar=document.getElementById('pbar');for(let i=0;i<10;i++){const e=document.createElement('i'),c=PC[i%7];e.style.cssText='--c1:'+c[0]+';--c2:'+c[1];pbar.appendChild(e);}
const cells=[...pbar.children],pct=document.getElementById('pct'),tip=document.getElementById('tip'),ar=document.getElementById('ar'),en=document.getElementById('enter');
const T=['Ketuk layar saat lantai pas di atas pijakan','Makin tinggi lantainya, makin besar pengalinya','Cash out sebelum menara roboh'];
let ti=0,p=0,fonts=false,done=false,gone=false;tip.textContent=T[0];
setInterval(()=>{ti=(ti+1)%T.length;tip.textContent=T[ti];},2200);
const fin=()=>fonts=true;(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fin);setTimeout(fin,4500);
const t0=performance.now();
(function st(now){
  const el=(now-t0)/3400;let tg=Math.min(1,el*el*(3-2*Math.min(1,el)));if(!fonts)tg=Math.min(tg,.9);
  p+=(tg-p)*.15;const n=Math.floor(p*10+.02);cells.forEach((c,i)=>c.classList.toggle('on',i<n));
  pct.textContent=(done?'SIAP!':'MEMBANGUN '+Math.round(p*100)+'%');
  if(!done&&p>.985&&fonts){done=true;n===10;cells.forEach(c=>c.classList.add('on'));ar.classList.add('done');}
  if(!gone)requestAnimationFrame(st);
})(t0);
function go(){if(!done||gone)return;gone=true;document.body.classList.add('open');boot.classList.add('out');setTimeout(()=>{boot.remove();document.body.classList.add('ready');},800);}
en.addEventListener('click',go);
window.addEventListener('keydown',e=>{if(!document.getElementById('boot'))return;e.stopPropagation();e.preventDefault();if(e.code==='Enter'||e.code==='Space')go();},true);
})();
</script>
